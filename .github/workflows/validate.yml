name: Validate

on:
  pull_request:
    paths:
      - 'projects/**'
      - 'schema/**'
      - 'scripts/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  workflow_dispatch:

# Never use pull_request_target here: PRs come from forks and must not get write tokens.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate entries
        run: node scripts/validate.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty on workflow_dispatch, in which case every entry is checked online.
          BASE_REF: ${{ github.base_ref }}
      - name: Build site (smoke test)
        run: node scripts/build-site.mjs
      - name: Unit tests
        run: npm test
