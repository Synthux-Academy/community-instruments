name: Validate

on:
  pull_request:
    paths:
      - 'projects/**'
      - 'schema/**'
      - 'templates/**'
      - 'scripts/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  workflow_dispatch:

# Offline checks only: no API calls, so pushes can't burn rate limits. Reviewers
# run the online repo checks on demand with check-repos.yml.
#
# Never use pull_request_target here: PRs come from forks and must not get write tokens.
permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate entries
        run: node scripts/validate.mjs --offline
      - name: Build site (smoke test)
        run: node scripts/build-site.mjs
      - name: Unit tests
        run: npm test
